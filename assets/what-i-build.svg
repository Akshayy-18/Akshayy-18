<g font-family="Segoe UI,Arial,sans-serif"><rect x="30" y="28" width="360" height="195" rx="12" fill="#13243b" stroke="#2b405c"/><text x="54" y="69" font-size="14" fill="#6ed5f5">01 / BUILD</text><text x="54" y="113" font-size="24" font-weight="600" fill="#f3f7fc">Sales automation</text><text x="54" y="153" font-size="18" fill="#a7bbd2">Quote creation, pricing</text><text x="54" y="181" font-size="18" fill="#a7bbd2">and approval workflows.</text><rect x="420" y="28" width="360" height="195" rx="12" fill="#13243b" stroke="#2b405c"/><text x="444" y="69" font-size="14" fill="#6ed5f5">02 / BUILD</text><text x="444" y="113" font-size="24" font-weight="600" fill="#f3f7fc">Lightning interfaces</text><text x="444" y="153" font-size="18" fill="#a7bbd2">Responsive components</text><text x="444" y="181" font-size="18" fill="#a7bbd2">driven by Salesforce metadata.</text><rect x="810" y="28" width="360" height="195" rx="12" fill="#13243b" stroke="#2b405c"/><text x="834" y="69" font-size="14" fill="#6ed5f5">03 / BUILD</text><text x="834" y="113" font-size="24" font-weight="600" fill="#f3f7fc">Connected systems</text><text x="834" y="153" font-size="18" fill="#a7bbd2">REST integrations and</text><text x="834" y="181" font-size="18" fill="#a7bbd2">asynchronous Apex processing.</text></g></svg>